name: Build LiteTV APK

on:
  push:
    paths:
      - 'LiteTV.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q LiteTV.zip -d source
          PROJECT_DIR="source/LiteTV"
          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] || [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::No se encontró un proyecto Gradle Android válido en source/LiteTV."
            find source -maxdepth 5 -type f | sort | head -250
            exit 1
          fi
          echo "Proyecto encontrado en $PROJECT_DIR"

      - name: Show PlayerEngine source for diagnosis
        run: sed -n '1,220p' app/src/main/java/com/litetv/app/PlayerEngine.kt
        working-directory: source/LiteTV

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug
        working-directory: source/LiteTV

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LiteTV-debug-apk
          path: source/LiteTV/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

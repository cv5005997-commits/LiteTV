name: Build LiteTV APK

on:
  push:
    paths:
      - 'LiteTV.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q LiteTV.zip -d source
          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::No se encontró gradlew dentro de LiteTV.zip."
            echo "Contenido del ZIP:"
            find source -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

      - name: Build debug APK
        run: cd "$PROJECT_DIR" && ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LiteTV-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
